# Oh My Pi project settings for the Crucible workspace.
# Loaded only when `omp` starts in /mnt/data/crucible (settings do not walk
# ancestor directories; agent discovery under .omp/agents does).
# See agent-docs/omp/README.md.

task:
  # No agentModelOverrides: the agent files name no model, so every agent runs
  # on the session's model in both harnesses. (omp precedence: this map >
  # frontmatter > parent model; `model: inherit` in frontmatter fails in omp
  # with "No model selected", so leave the line out instead.)
  # Validate effort/thinkingLevel with agent-docs/omp/check-agents.sh.
  # Keep finished writers/reviewers live so `write agent://<id>` can resume
  # them with their transcript during long review rounds (default 7 min).
  agentIdleTtlMs: 0

tools:
  approval:
    # Auto-approve Eval; its shells are not covered by bash.patterns.
    eval: allow

bash:
  # Steps 1-6 of the test workflows never commit or deliver. `prompt` asks the
  # user in the main session and fails the call inside a headless subagent,
  # which is the intended split: only the orchestrator delivers. Deny and
  # prompt rules also match segments of compound commands.
  patterns:
    - match: "git commit*"
      approval: prompt
    - match: "git push*"
      approval: prompt
    - match: "gh pr *"
      approval: prompt
    - match: "gh release *"
      approval: prompt
