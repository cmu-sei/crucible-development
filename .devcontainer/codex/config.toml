# Repo-managed Codex defaults, bind-mounted read-only at /etc/codex/config.toml. This is
# Codex's lowest-precedence layer, so personal settings in ~/.codex/config.toml always
# win.

model_provider = "amazon-bedrock-runtime"
model = "us.openai.gpt-6-sol"
model_reasoning_effort = "medium"

# Bedrock's OpenAI models reject the Responses `reasoning.summary` parameter outright
# ("Unsupported parameter: 'reasoning.summary' is not supported with the '<model>'
# model").
model_reasoning_summary = "none"

[projects."/workspaces/crucible-development"]
trust_level = "trusted"
