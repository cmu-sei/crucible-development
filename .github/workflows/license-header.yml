name: License Header Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  header-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the action commits and pushes missing headers
    steps:
      - name: Check Headers
        uses: cmu-sei/Crucible-Github-Actions/actions/header@header-v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
